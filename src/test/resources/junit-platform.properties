# 默认对测试类/测试方法做随机排序，但使用固定种子 => 顺序被打乱、但可复现。
# 目的：强制所有用例彼此独立（不依赖先后顺序），同时保留可重放的顺序。
# 换种子：-Djunit.jupiter.execution.order.random.seed=<n>（系统属性优先于此文件）
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.execution.order.random.seed=20261005
# 单线程执行：并发语义由用例内部线程池验证，框架层面不并行，避免引入额外共享态干扰
junit.jupiter.execution.parallel.enabled=false
