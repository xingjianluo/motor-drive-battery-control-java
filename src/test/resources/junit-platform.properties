# 自动化测试默认以随机顺序执行（类之间、类内方法都随机），
# 强制每个用例彼此独立：任何用例都不得依赖前一个用例留下的状态。
# 种子固定以保证本次提交可复现；命令行可覆盖种子以换一种洗牌：
#   -Djunit.jupiter.execution.classorderer.random.seed=<n>
#   -Djunit.jupiter.execution.methodorderer.random.seed=<n>
# 回到声明顺序：把下面两行的值改为
#   org.junit.jupiter.api.ClassOrderer.ClassName / org.junit.jupiter.api.MethodOrderer.MethodName
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.execution.classorderer.random.seed=42
junit.jupiter.execution.methodorderer.random.seed=42
# 自动注册通过 ServiceLoader 声明的 JUnit 扩展（support/TestProgressLogger：
# 统一打印每个用例的“开始/通过/失败”与业务域，日志即可看出覆盖范围与每个用例结果）
junit.jupiter.extensions.autodetection.enabled=true
