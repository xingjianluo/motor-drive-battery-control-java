# 电驱动与电池功率协同控制子系统配置

# 事件日志文件路径（留空=仅内存日志，进程重启不保留；
# 配置路径则落盘，启动时自动重放以复现账本与故障状态）
power.control.event-log-path=
# 过温降级后允许的功率系数（0~1）
power.control.over-temp-derate-factor=0.5
# 停机闭锁时冻结的安全储备（Wh）
power.control.shutdown-reserve-wh=200

# 默认物理规格（可在 config/SystemBeans 中调整）
# 电池：40000Wh / 350V / 300A / 欠压300V / 过温55℃ / 恢复45℃
# 逆变器：额定80kW（硬上限）/ 过温65℃ / 恢复55℃
# 电机：额定250A / 过温70℃ / 最小可执行功率1000W

logging.level.com.github.xingjianluo=INFO
