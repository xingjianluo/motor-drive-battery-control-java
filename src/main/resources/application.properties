# 电驱动与电池功率协同控制子系统配置
# 为每次运行使用独立的事件日志文件，避免本地启动时重复重放历史数据
power.eventlog.path=./data/power-events-${random.uuid}.log
power.battery.voltage=350.0
power.battery.capacityAh=60.0
power.battery.maxCurrentA=300.0
power.battery.initialSoc=0.9
power.inverter.maxPowerW=80000.0
power.motor.maxRpm=12000.0
power.motor.initialTempC=35.0
power.motor.ratedPowerW=80000.0
